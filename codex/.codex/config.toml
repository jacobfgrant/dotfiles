# Codex configuration and preferences
model = "gpt-6-sol"
model_reasoning_effort = "high"
project_doc_fallback_filenames = ["CLAUDE.md"]

approval_policy = "on-request"
approvals_reviewer = "user"

# Permission profiles replace sandbox_mode / sandbox_workspace_write.
default_permissions = "development"

[permissions.development]
description = "Workspace edits, protected credentials, and approval for network access"
extends = ":workspace"

[permissions.development.network]
enabled = false

[permissions.development.filesystem]
"~/.ssh" = "deny"
"~/.aws" = "deny"
"~/.gnupg" = "deny"
"~/.kube" = "deny"
"~/.config/gh" = "deny"
"~/.netrc" = "deny"
# Bound recursive glob expansion on Linux and Windows.
glob_scan_max_depth = 8

[permissions.development.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*.key" = "deny"
"**/*.pem" = "deny"
"**/*.p12" = "deny"
"**/*.pfx" = "deny"
"**/secrets/**" = "deny"

# Used by codex-delegate for review, adversarial review, and consult runs.
# Reads are "home minus credential stores" rather than strictly workspace-only:
# a blanket "~" = "deny" also blocks the ~/.gitconfig symlink, and a file-level
# read entry does not override a denied parent for symlinks, so git breaks.
# ~/.codex itself must stay readable: Codex re-executes its own binary from
# ~/.codex/packages inside the sandbox to load AGENTS.md, so only the
# credential and transcript paths under it are denied.
[permissions.review]
description = "Read-only, no network, credential stores and secret files denied"
extends = ":read-only"

[permissions.review.network]
enabled = false

[permissions.review.filesystem]
"~/.ssh" = "deny"
"~/.aws" = "deny"
"~/.gnupg" = "deny"
"~/.kube" = "deny"
"~/.config/gh" = "deny"
"~/.config/gcloud" = "deny"
"~/.netrc" = "deny"
"~/.npmrc" = "deny"
"~/.pypirc" = "deny"
"~/.docker" = "deny"
"~/.terraform.d" = "deny"
"~/.codex/auth.json" = "deny"
"~/.codex/sessions" = "deny"
"~/.codex/history.jsonl" = "deny"
"~/.claude" = "deny"
"~/Library" = "deny"
glob_scan_max_depth = 8

[permissions.review.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*.key" = "deny"
"**/*.pem" = "deny"
"**/*.p12" = "deny"
"**/*.pfx" = "deny"
"**/secrets/**" = "deny"

[tui]
notifications = false

# Retained from this machine's existing config. Other checkouts can remove or
# replace these paths; Codex also records newly trusted projects in this file.
[projects."/Users/jacobfgrant/Developer/Git/jacobfgrant/before-tuesday"]
trust_level = "trusted"

[projects."/Users/jacobfgrant/.dotfiles"]
trust_level = "trusted"

